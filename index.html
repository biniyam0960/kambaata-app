<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kambaata Text Generator</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  textarea { width: 100%; height: 80px; padding: .6rem; font-size: 1rem; box-sizing: border-box; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  input[type=range] { width: 100%; }
  button { margin-top: 1.2rem; padding: .7rem 1.4rem; font-size: 1rem; border: 0; border-radius: 6px; background: #2b6cb0; color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #out { white-space: pre-wrap; background: #f4f4f5; padding: 1rem; border-radius: 6px; margin-top: 1.2rem; min-height: 3rem; }
  .note { color: #555; font-size: .85rem; margin-top: 1.5rem; }
</style>
</head>
<body>
<h1>Kambaata Text Generator</h1>
<p>Type the start of a sentence, choose the length and creativity, then generate.</p>

<label for="prompt">Prompt</label>
<textarea id="prompt" placeholder="Maganu"></textarea>

<label>Length: <span id="lenv">60</span> tokens (about <span id="words">37</span> words)</label>
<input id="len" type="range" min="10" max="200" step="5" value="60">

<label>Temperature: <span id="tempv">0.8</span> <small>(low = safe and repetitive, high = varied and messier)</small></label>
<input id="temp" type="range" min="0.1" max="1.5" step="0.05" value="0.8">

<button id="go">Generate</button>
<div id="out"></div>
<p class="note">Small research model trained on about 1M tokens of mostly religious-style text. Output looks like Kambaata but is often not meaningful.</p>

<script>
  const API_URL = "/api/generate";   // same server. For a separate host use the full backend URL.
  const $ = id => document.getElementById(id);
  $("len").oninput  = () => { $("lenv").textContent = $("len").value; $("words").textContent = Math.round($("len").value / 1.6); };
  $("temp").oninput = () => { $("tempv").textContent = $("temp").value; };

  $("go").onclick = async () => {
    $("go").disabled = true; $("out").textContent = "Generating...";
    try {
      const r = await fetch(API_URL, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: $("prompt").value, max_new_tokens: +$("len").value, temperature: +$("temp").value })
      });
      if (!r.ok) throw new Error("Server error " + r.status);
      $("out").textContent = (await r.json()).text;
    } catch (e) { $("out").textContent = "Error: " + e.message; }
    $("go").disabled = false;
  };
</script>
</body>
</html>
